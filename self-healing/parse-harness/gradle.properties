# In CI, setup-java provides the JDK (JAVA_HOME) that Gradle runs on — do NOT pin
# org.gradle.java.home here (that would point at a machine-local path that does not
# exist on the runner). Locally you can run with a full JDK on PATH/JAVA_HOME.
# Toolchain auto-provisioning stays off so compile/run use the Gradle JVM directly.
org.gradle.java.installations.auto-download=false
org.gradle.daemon=false
